name: Build PullOverX MenuOnly

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install theos
        run: |
          export THEOS=$HOME/theos
          sudo git clone --recursive https://github.com/theos/theos.git $THEOS
          sudo chown -R $(id -u):$(id -g) $THEOS
          mkdir -p $THEOS/sdks
          curl -L -o /tmp/sdk.tar.xz "https://github.com/theos/sdks/raw/master/iPhoneOS14.5.sdk.tar.xz"
          tar xf /tmp/sdk.tar.xz -C $THEOS/sdks
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "THEOS_PACKAGE_SCHEME=roothide" >> $GITHUB_ENV

      - name: Install tools
        run: |
          brew install ldid dpkg make || true
          echo "$(brew --prefix dpkg)/bin" >> $GITHUB_PATH || true
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH || true

      - name: Build
        run: |
          chmod +x build.sh
          sudo ROOTLESS=1 ./build.sh roothide release 2>&1 | tail -60

      - name: Collect artifacts
        if: always()
        run: |
          echo "=== searching deb ==="
          find . -name "*.deb" -o -name "*.dylib" | head -20

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PullOverX-build
          path: |
            **/*.deb
            **/PullOverX.dylib
          retention-days: 30
