name: Build PullOverX MenuOnly

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install theos
        run: |
          export THEOS=$HOME/theos
          git clone --recursive --depth 1 https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: Link Xcode SDK into theos
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          VERSION=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "Xcode SDK: $SDK (iOS $VERSION)"
          mkdir -p $THEOS/sdks
          ln -sfn "$SDK" "$THEOS/sdks/iPhoneOS${VERSION}.sdk"
          ls -la $THEOS/sdks/

      - name: Install tools
        run: |
          brew install ldid dpkg || true
          echo "$(brew --prefix dpkg)/bin" >> $GITHUB_PATH || true

      - name: Build
        run: |
          chmod +x build.sh
          ./build.sh roothide release 2>&1 | tail -80

      - name: List artifacts
        if: always()
        run: find . -name "*.deb" | head -10

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PullOverX-build
          path: |
            **/*.deb
            **/PullOverX.dylib
          retention-days: 30
